<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>SQL Learning Lab DDL 03</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f7fa; }
        #mainTitle {
            width: 100vw;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            text-align: center;
            font-size: 2.1em;
            font-weight: bold;
            margin: 0;
            padding: 0.75em 0 0.4em 0;
            letter-spacing: 1.3px;
            color: #1976d2;
            background: #f8fafc;
            border-bottom: 2px solid #cfd8dc;
            box-shadow: 0 4px 24px #b6c8e830;
            text-shadow: 0 2px 8px #b6c8e855;
        }
        #versionTag {
            display: inline-block;
            margin-left: 1em;
            font-size: 0.7em;
            vertical-align: middle;
            background: #1976d2;
            color: #fff;
            border-radius: 12px;
            padding: 0.2em 1em;
            font-weight: 700;
            letter-spacing: 1.2px;
            box-shadow: 0 1px 7px #b0bec580;
        }
        #container { display: flex; min-height: 100vh; padding-top: 4.5em; }
        #left {
            flex: 1.2;
            background: #f8fafc;
            padding: 2em 1.2em 2em 2.5em;
            border-right: 2px solid #cfd8dc;
            min-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            overflow-y: auto;
        }
        #right {
            flex: 1;
            background: #e3e3e3;
            padding: 2.5em 2em;
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        .table-cards {
            display: flex;
            flex-wrap: wrap;
            gap: 2em 2.5em;
            margin-top: 1em;
        }
        .table-card {
            min-width: 210px;
            min-height: 110px;
            border-radius: 16px;
            box-shadow: 0 3px 14px #bbc7ce9c;
            padding: 1.2em 1.1em 1em 1.1em;
            margin-bottom: 10px;
            color: #fff;
            font-size: 1em;
            display: flex;
            flex-direction: column;
        }
        .room-color-0 { background: linear-gradient(135deg, #00bcd4 85%, #0097a7 100%); }
        .room-color-1 { background: linear-gradient(135deg, #7e57c2 85%, #512da8 100%); }
        .room-color-2 { background: linear-gradient(135deg, #ef6c00 85%, #d84315 100%); }
        .room-color-3 { background: linear-gradient(135deg, #43a047 85%, #2e7d32 100%); }
        .room-color-4 { background: linear-gradient(135deg, #c62828 85%, #ad1457 100%); }
        .table-title {
            font-weight: bold;
            font-size: 1.15em;
            margin-bottom: .25em;
        }
        .table-info {
            font-size: 0.9em;
            opacity: 0.95;
            margin-bottom: 0.5em;
        }
        .table-columns {
            margin-top: 0.5em;
            font-family: 'Fira Mono', 'Consolas', monospace;
            font-size: 0.95em;
        }
        #sqlInput {
            width: 100%;
            min-height: 100px;
            font-size: 1.1em;
            font-family: 'Fira Mono', 'Consolas', monospace;
            border-radius: 7px;
            border: 1.5px solid #b0bec5;
            margin-bottom: 0.7em;
            padding: 0.9em 1em;
            background: #f9fafb;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        #sqlInput:focus { border-color: #42a5f5; }
        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8em;
            margin-bottom: 1em;
        }
        button {
            padding: 0.7em 1.5em;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #1976d2;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s, transform 0.13s;
        }
        button:hover { background: #1565c0; transform: translateY(-1px); }
        .btn-secondary { background: #616161; }
        .btn-secondary:hover { background: #424242; }
        .btn-success { background: #388e3c; }
        .btn-success:hover { background: #2e7d31; }
        .btn-warning { background: #f57c00; }
        .btn-warning:hover { background: #ef6c00; }
        .btn-danger { background: #d32f2f; }
        .btn-danger:hover { background: #c62828; }
        #output {
            padding: 1em;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 6px;
            min-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: 'Consolas', 'Courier New', monospace;
            margin-bottom: 1em;
        }
        #output table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0.5em;
        }
        #output th, #output td {
            border: 1px solid #ddd;
            padding: 0.5em;
            text-align: left;
        }
        #output th {
            background: #f5f5f5;
            font-weight: bold;
        }
        .example-buttons {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0.8em;
            margin-bottom: 1em;
        }
        .example-buttons button { font-size: 0.95em; padding: 0.65em 1em; }
        .help-text {
            margin-top: 1em;
            font-size: 0.95em;
            color: #424242;
        }
        @media (max-width: 900px) {
            #container { flex-direction: column; padding-top: 5.5em; }
            #mainTitle { font-size: 1.3em; padding: 0.7em 0 0.3em 0; }
            #left, #right { min-width: 0; width: 100%; padding-left: 1.5em; padding-right: 1.5em; }
            .table-cards { justify-content: center; }
        }
    </style>
</head>
<body>
    <div id="mainTitle">
        SQL Learning Lab DDL 03 <span id="versionTag">v01</span>
    </div>
    <div id="container">
        <div id="left">
            <h2>Tablas en la base de datos</h2>
            <div class="table-cards" id="tableCards"></div>
        </div>
        <div id="right">
            <textarea id="sqlInput" spellcheck="false" placeholder="Escribe aquí tu código SQL"></textarea>
            <div class="button-row">
                <button id="btnEjecutar">Ejecutar</button>
                <button id="btnBorrar" class="btn-secondary">Borrar</button>
                <button id="btnReiniciar" class="btn-danger">Reiniciar BD</button>
            </div>
            <div class="example-buttons">
                <button id="btnCrearTabla" class="btn-success">Crear tabla</button>
                <button id="btnInsertarDatos" class="btn-warning">Insertar datos</button>
                <button id="btnConsultarDatos" class="btn-secondary">Consultar datos</button>
                <button id="btnActualizarDatos" class="btn-secondary">Actualizar datos</button>
                <button id="btnUnirTablas" class="btn-secondary">Unir tablas</button>
            </div>
            <div id="output">Usa los botones para cargar ejemplos o escribe tu SQL y pulsa "Ejecutar".</div>
            <div class="help-text">Puedes usar TAB dentro del editor para sangrar texto y Ctrl+Enter para ejecutar.</div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <script src="app.js"></script>
</body>
</html>
