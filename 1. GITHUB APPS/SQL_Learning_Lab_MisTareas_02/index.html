<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>
    window.SQL_LAB_VERSION = "1";
  </script>
  <title>SQL_Learning_Lab_MisTareas_02</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; background: #f4f6fb; }
    body { display: flex; flex-direction: column; }
    #main-title { margin: 20px auto 0; font-size: 2rem; color: #1d3557; text-align: center; }
    #container { display: flex; flex: 1; min-height: 0; gap: 16px; padding: 16px; }
    #left { width: 38%; background: #eef3fb; border-radius: 14px; padding: 20px; box-shadow: 0 10px 25px rgba(26, 79, 143, 0.08); display: flex; flex-direction: column; }
    #right { flex: 1; background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 10px 25px rgba(26, 79, 143, 0.08); overflow: auto; }
    .btn-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
    button { border: none; background: #3a6df0; color: #fff; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; transition: transform 0.15s ease, background 0.2s ease; }
    button:hover { background: #2854b6; transform: translateY(-1px); }
    button.secondary { background: #6c7a99; }
    button.secondary:hover { background: #55637d; }
    button.small { padding: 6px 10px; font-size: 0.85rem; }
    #sql-editor { width: 100%; min-height: 180px; resize: vertical; border-radius: 12px; border: 1px solid #c5d2ea; padding: 12px; font-family: monospace; font-size: 0.95rem; background: #f8fbff; }
    #msg { min-height: 24px; margin: 12px 0 0; color: #2d7a35; font-weight: 600; }
    #output { margin-top: 14px; padding: 14px; background: #fff; border-radius: 12px; border: 1px solid #d7e1f4; min-height: 120px; font-family: monospace; font-size: 0.9rem; overflow-x: auto; }
    #tasks-panel { display: grid; gap: 18px; }
    details { border: 1px solid #d4d9f0; border-radius: 12px; padding: 12px 14px; background: #fbfcff; }
    summary { font-weight: 700; cursor: pointer; outline: none; }
    .section-title { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 0.82rem; background: #e8f0fe; color: #2f5eca; }
    .badge.red { background: #ffe6e5; color: #c53929; }
    .badge.green { background: #e6f7e9; color: #247a35; }
    .badge.yellow { background: #fff4d6; color: #a87d00; }
    .task-item { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px; border: 1px solid #dce2f0; border-radius: 12px; background: #fff; align-items: start; }
    .task-main { display: flex; flex-direction: column; gap: 6px; }
    .task-title { font-weight: 700; color: #1f3564; }
    .task-description { color: #5a637a; font-size: 0.95rem; }
    .task-meta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.82rem; color: #4b567c; }
    .task-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
    .task-actions button { padding: 7px 10px; font-size: 0.8rem; border-radius: 8px; }
    .task-actions button.edit { background: #f5a623; }
    .task-actions button.edit:hover { background: #d98d16; }
    .task-actions button.delete { background: #f44336; }
    .task-actions button.delete:hover { background: #c12d25; }
    .task-actions button.toggle { background: #4c8bff; }
    .task-actions button.toggle:hover { background: #2f6fe6; }
    .hint { font-size: 0.9rem; color: #6b7280; margin-top: 10px; }
    @media (max-width: 980px) { #container { flex-direction: column; } #left { width: 100%; } }
  </style>
</head>
<body>
  <h1 id="main-title"></h1>
  <div id="container">
    <div id="left">
      <div class="btn-group">
        <button id="ejecutarBtn">Ejecutar SQL</button>
        <button id="borrarBtn" class="secondary">Borrar editor</button>
        <button id="initBtn">Inicializar BD</button>
        <button id="eliminarBtn" class="secondary">Eliminar BD</button>
        <button id="actualizarBtn">Actualizar vista</button>
      </div>
      <textarea id="sql-editor" spellcheck="false" placeholder="Escribe tu código SQL aquí..."></textarea>
      <div id="msg"></div>
      <div id="output"></div>
    </div>
    <div id="right">
      <div class="section-title"><span style="font-size:1.1rem;font-weight:700;">Panel de tareas</span><span class="badge">SQL Engine</span></div>
      <div id="tasks-panel"></div>
      <div class="hint">Haz clic en los botones de cada tarea para generar la consulta SQL correspondiente. Luego edita/ejecuta desde el editor.</div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const title = document.getElementById('main-title');
      title.textContent = 'SQL_Learning_Lab_MisTareas_02 - Versión ' + (window.SQL_LAB_VERSION || '1');
    });

    let db = null;
    let SQL = null;

    const initSQL = `
CREATE TABLE IF NOT EXISTS categorias (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  nombre TEXT NOT NULL
);

CREATE TABLE IF NOT EXISTS tareas (
  id INTEGER PRIMARY KEY AUTOINCREMENT,
  categoria_id INTEGER,
  nombre TEXT NOT NULL,
  descripcion TEXT DEFAULT '',
  terminada INTEGER DEFAULT 0,
  urgente INTEGER DEFAULT 0,
  hoy INTEGER DEFAULT 0,
  creado_en TEXT DEFAULT CURRENT_TIMESTAMP,
  FOREIGN KEY(categoria_id) REFERENCES categorias(id)
);

INSERT INTO categorias (nombre) VALUES
  ('Personal'),
  ('Trabajo'),
  ('Estudio');

INSERT INTO tareas (categoria_id, nombre, descripcion, terminada, urgente, hoy) VALUES
  (1, 'Comprar leche', 'Ir al supermercado y comprar leche', 0, 0, 1),
  (2, 'Enviar informe semanal', 'Enviar el informe al jefe antes del cierre', 0, 1, 0),
  (3, 'Repasar clases de SQL', 'Estudiar sentencias SELECT y JOIN', 0, 0, 1),
  (2, 'Llamar a soporte', 'Resolver la incidencia de la impressora', 0, 1, 0),
  (1, 'Organizar mochila', 'Preparar la mochila para hoy', 0, 0, 1);
`;

    function initSqlJsAndStart() {
      window.initSqlJs({ locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}` })
        .then(SQLLib => {
          SQL = SQLLib;
          inicializarBBDD();
        })
        .catch(error => mostrarMensaje('Error cargando sql.js: ' + error.message, true));
    }

    function inicializarBBDD() {
      db = new SQL.Database();
      ejecutarSQL(initSQL, false);
      document.getElementById('sql-editor').value = initSQL.trim();
      actualizarVistaTareas();
      mostrarMensaje('Base de datos inicializada.', false);
    }

    function eliminarBBDD() {
      db = new SQL.Database();
      document.getElementById('output').innerHTML = '';
      actualizarVistaTareas();
      mostrarMensaje('Base de datos eliminada (vacía).', false);
    }

    function ejecutarDesdeEditor() {
      const code = document.getElementById('sql-editor').value;
      if (!code.trim()) {
        mostrarMensaje('Introduce algún código SQL.', true);
        return;
      }
      ejecutarSQL(code, true);
      actualizarVistaTareas();
    }

    function ejecutarSQL(sql, mostrarOK) {
      try {
        const results = db.exec(sql);
        if (results.length > 0 && results[0].values && results[0].values.length > 0) {
          const rows = formatResults(results[0]);
          printResult(rows);
          if (mostrarOK) mostrarMensaje('Consulta ejecutada correctamente.', false);
        } else {
          document.getElementById('output').innerHTML = '';
          if (mostrarOK) mostrarMensaje('SQL ejecutado correctamente.', false);
        }
        randomHeaderColor();
      } catch (e) {
        mostrarMensaje('Error SQL: ' + e.message, true);
        document.getElementById('output').innerHTML = '';
        setHeaderError();
      }
    }

    function formatResults(result) {
      const cols = result.columns || [];
      return result.values.map(row => {
        const obj = {};
        row.forEach((value, index) => obj[cols[index]] = value);
        return obj;
      });
    }

    function printResult(rows) {
      const output = document.getElementById('output');
      if (!rows || rows.length === 0) {
        output.innerHTML = '<pre>No hay resultados para mostrar.</pre>';
        return;
      }
      let html = '<table><thead><tr>';
      Object.keys(rows[0]).forEach(col => html += `<th>${col}</th>`);
      html += '</tr></thead><tbody>';
      rows.forEach(row => {
        html += '<tr>';
        Object.values(row).forEach(value => html += `<td>${value}</td>`);
        html += '</tr>';
      });
      html += '</tbody></table>';
      output.innerHTML = html;
    }

    function borrarEditor() {
      document.getElementById('sql-editor').value = '';
      document.getElementById('output').innerHTML = '';
      mostrarMensaje('', false);
    }

    function randomHeaderColor() {
      const colors = ['#e6f2ff', '#f3f8e8', '#fff7db', '#f9e8ff', '#eaf4ff'];
      document.getElementById('main-title').style.background = colors[Math.floor(Math.random() * colors.length)];
    }

    function setHeaderError() {
      document.getElementById('main-title').style.background = '#f8d7da';
    }

    function mostrarMensaje(msg, esError) {
      const el = document.getElementById('msg');
      el.textContent = msg;
      el.style.color = esError ? '#c0392b' : '#2d7a35';
    }

    function actualizarVistaTareas() {
      const panel = document.getElementById('tasks-panel');
      panel.innerHTML = '';
      if (!db) return;

      const categorias = fetchRows('SELECT id, nombre FROM categorias ORDER BY nombre;');
      const tareas = fetchRows(`SELECT t.id, t.nombre, t.descripcion, t.terminada, t.urgente, t.hoy, c.nombre AS categoria
        FROM tareas t
        LEFT JOIN categorias c ON c.id = t.categoria_id
        ORDER BY t.terminada, t.urgente DESC, t.hoy DESC, t.id;`);
      const urgentes = tareas.filter(t => t.urgente === 1);
      const hoy = tareas.filter(t => t.hoy === 1);

      panel.appendChild(createSection('Urgentes', urgentes, 'Urgentes', 'urgent', `SELECT id, nombre, descripcion, terminada, urgente, hoy FROM tareas WHERE urgente = 1;`));
      panel.appendChild(createSection('Hoy', hoy, 'Hoy', 'today', `SELECT id, nombre, descripcion, terminada, urgente, hoy FROM tareas WHERE hoy = 1;`));
      panel.appendChild(createCategoriesSection(categorias, tareas));
    }

    function fetchRows(sql) {
      try {
        const res = db.exec(sql);
        if (!res.length) return [];
        return formatResults(res[0]);
      } catch {
        return [];
      }
    }

    function createSection(title, rows, type, key, sqlExample) {
      const details = document.createElement('details');
      details.open = true;
      const summary = document.createElement('summary');
      summary.innerHTML = `${title} <span class="badge">${rows.length}</span>`;
      details.appendChild(summary);

      const addRow = document.createElement('div');
      addRow.style.display = 'flex';
      addRow.style.justifyContent = 'space-between';
      addRow.style.alignItems = 'center';
      addRow.style.marginBottom = '12px';

      const hint = document.createElement('div');
      hint.style.color = '#5f6d8f';
      hint.style.fontSize = '0.88rem';
      hint.textContent = `Haz clic en una tarea para generar SQL de actualización.`;
      addRow.appendChild(hint);

      details.appendChild(addRow);

      if (rows.length === 0) {
        const empty = document.createElement('div');
        empty.style.color = '#7a7f94';
        empty.textContent = 'No hay tareas en esta categoría.';
        details.appendChild(empty);
        return details;
      }

      rows.forEach(row => details.appendChild(createTaskItem(row)));
      return details;
    }

    function createCategoriesSection(categories, tasks) {
      const details = document.createElement('details');
      details.open = true;
      const summary = document.createElement('summary');
      summary.innerHTML = `Por categorías <span class="badge">${categories.length}</span>`;
      details.appendChild(summary);

      const buttonsRow = document.createElement('div');
      buttonsRow.style.display = 'flex';
      buttonsRow.style.flexWrap = 'wrap';
      buttonsRow.style.gap = '8px';
      buttonsRow.style.margin = '10px 0';
      buttonsRow.appendChild(createSmallButton('Agregar categoría', () => {
        document.getElementById('sql-editor').value = `INSERT INTO categorias (nombre) VALUES ('Nueva categoría');`;
        mostrarMensaje('Consulta INSERT para categoría generada.', false);
      }));
      buttonsRow.appendChild(createSmallButton('Nueva tarea general', () => {
        document.getElementById('sql-editor').value = `INSERT INTO tareas (categoria_id, nombre, descripcion, terminada, urgente, hoy) VALUES (NULL, 'Nueva tarea', 'Descripción...', 0, 0, 0);`;
        mostrarMensaje('Consulta INSERT para nueva tarea generada.', false);
      }));
      details.appendChild(buttonsRow);

      if (categories.length === 0) {
        const empty = document.createElement('div');
        empty.style.color = '#7a7f94';
        empty.textContent = 'No hay categorías definidas.';
        details.appendChild(empty);
        return details;
      }

      categories.forEach(category => {
        const categoryTasks = tasks.filter(t => t.categoria === category.nombre);
        const catDetails = document.createElement('details');
        catDetails.style.margin = '10px 0';
        catDetails.open = true;
        const catSummary = document.createElement('summary');
        catSummary.innerHTML = `${category.nombre} <span class="badge">${categoryTasks.length}</span>`;
        catDetails.appendChild(catSummary);

        const catButtons = document.createElement('div');
        catButtons.style.margin = '10px 0 10px 0';
        catButtons.style.display = 'flex';
        catButtons.style.flexWrap = 'wrap';
        catButtons.style.gap = '8px';
        catButtons.appendChild(createSmallButton('Editar categoría', () => {
          document.getElementById('sql-editor').value = `UPDATE categorias SET nombre = '${category.nombre}' WHERE id = ${category.id};`;
          mostrarMensaje('Consulta UPDATE para categoría generada.', false);
        }));
        catButtons.appendChild(createSmallButton('Agregar tarea', () => {
          document.getElementById('sql-editor').value = `INSERT INTO tareas (categoria_id, nombre, descripcion, terminada, urgente, hoy) VALUES (${category.id}, 'Nueva tarea', 'Descripción...', 0, 0, 0);`;
          mostrarMensaje('Consulta INSERT para nueva tarea generada.', false);
        }));
        catDetails.appendChild(catButtons);

        if (categoryTasks.length === 0) {
          const empty = document.createElement('div');
          empty.style.color = '#7a7f94';
          empty.textContent = 'No hay tareas en esta categoría.';
          catDetails.appendChild(empty);
        } else {
          categoryTasks.forEach(task => catDetails.appendChild(createTaskItem(task)));
        }

        details.appendChild(catDetails);
      });

      return details;
    }

    function createTaskItem(task) {
      const item = document.createElement('div');
      item.className = 'task-item';

      const main = document.createElement('div');
      main.className = 'task-main';
      const title = document.createElement('div');
      title.className = 'task-title';
      title.textContent = task.nombre;
      main.appendChild(title);

      const description = document.createElement('div');
      description.className = 'task-description';
      description.textContent = task.descripcion || 'Sin descripción';
      main.appendChild(description);

      const meta = document.createElement('div');
      meta.className = 'task-meta';
      if (task.categoria) meta.innerHTML += `<span class="badge">${task.categoria}</span>`;
      meta.innerHTML += task.terminada ? `<span class="badge green">Terminada</span>` : `<span class="badge">Pendiente</span>`;
      if (task.urgente) meta.innerHTML += `<span class="badge red">Urgente</span>`;
      if (task.hoy) meta.innerHTML += `<span class="badge yellow">Hoy</span>`;
      main.appendChild(meta);

      const actions = document.createElement('div');
      actions.className = 'task-actions';
      actions.appendChild(createTaskButton(task, task.terminada ? 'Reabrir' : 'Terminar', `UPDATE tareas SET terminada = ${task.terminada ? 0 : 1} WHERE id = ${task.id};`, 'toggle'));
      actions.appendChild(createTaskButton(task, task.urgente ? 'Quitar urgente' : 'Urgente', `UPDATE tareas SET urgente = ${task.urgente ? 0 : 1} WHERE id = ${task.id};`, 'toggle'));
      actions.appendChild(createTaskButton(task, task.hoy ? 'Quitar hoy' : 'Hoy', `UPDATE tareas SET hoy = ${task.hoy ? 0 : 1} WHERE id = ${task.id};`, 'toggle'));
      actions.appendChild(createTaskButton(task, 'Editar', `UPDATE tareas SET nombre = '${task.nombre}', descripcion = '${task.descripcion.replace(/'/g, "''")}' WHERE id = ${task.id};`, 'edit'));
      actions.appendChild(createTaskButton(task, 'Eliminar', `DELETE FROM tareas WHERE id = ${task.id};`, 'delete'));

      item.appendChild(main);
      item.appendChild(actions);
      return item;
    }

    function createTaskButton(task, label, sql, type) {
      const button = document.createElement('button');
      button.textContent = label;
      button.className = type === 'delete' ? 'delete small' : type === 'edit' ? 'edit small' : 'toggle small';
      button.addEventListener('click', () => {
        document.getElementById('sql-editor').value = sql;
        mostrarMensaje(`Consulta ${label} generada para tarea id ${task.id}.`, false);
      });
      return button;
    }

    function createSmallButton(label, onclick) {
      const btn = document.createElement('button');
      btn.textContent = label;
      btn.className = 'secondary small';
      btn.addEventListener('click', onclick);
      return btn;
    }

    document.getElementById('ejecutarBtn').addEventListener('click', ejecutarDesdeEditor);
    document.getElementById('borrarBtn').addEventListener('click', borrarEditor);
    document.getElementById('initBtn').addEventListener('click', inicializarBBDD);
    document.getElementById('eliminarBtn').addEventListener('click', eliminarBBDD);
    document.getElementById('actualizarBtn').addEventListener('click', actualizarVistaTareas);

    initSqlJsAndStart();
  </script>
</body>
</html>
